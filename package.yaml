name:                sofetch
version:             0.1.0.4
github:              "iand675/sofetch"
license:             BSD-3-Clause
author:              "Ian Duncan"
maintainer:          "ian@iankduncan.com"
copyright:           "2026 Ian Duncan"
category:            Data
synopsis:            A low-boilerplate Haxl-like data fetching library

extra-source-files:
- README.md

extra-doc-files:
- CHANGELOG.md

description:         Please see the README on GitHub at <https://github.com/iand675/sofetch#readme>

dependencies:
- base >= 4.7 && < 5
- async >= 2.2 && < 2.3
- containers >= 0.6 && < 0.8
- exceptions >= 0.10 && < 0.11
- hashable >= 1.4 && < 1.6
- semigroupoids >= 6.0 && < 6.1
- text >= 1.2 && < 2.2
- time >= 1.9 && < 1.15
- transformers >= 0.5 && < 0.7
- unliftio-core >= 0.2 && < 0.3
- unordered-containers >= 0.2.16 && < 0.3

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

flags:
  examples:
    description: Build example executables
    manual: true
    default: false

library:
  source-dirs: src

executables:
  sqlite-blog:
    main: SqliteBlog.hs
    source-dirs: examples
    other-modules: []
    dependencies:
      - sofetch
      - sqlite-simple
      - bytestring
    ghc-options:
      - -threaded
    when:
      - condition: "!flag(examples)"
        buildable: false

  github-explorer:
    main: GitHubExplorer.hs
    source-dirs: examples
    other-modules: []
    dependencies:
      - sofetch
      - http-client
      - http-client-tls
      - http-types
      - aeson
      - bytestring
    ghc-options:
      - -threaded
    when:
      - condition: "!flag(examples)"
        buildable: false

tests:
  sofetch-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - sofetch
    - hspec